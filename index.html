<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Workbench — maintenance work-order system with a drag-and-drop Kanban board and role-based access. A frontend portfolio project built with React, TypeScript, TanStack Query, dnd-kit and MSW." />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)" />
    <meta property="og:title" content="Workbench — maintenance work orders" />
    <meta property="og:description" content="Plan, assign and track maintenance work on a Kanban board, with roles and permissions." />
    <meta property="og:type" content="website" />
    <title>Workbench</title>
    <script>
      // Apply the theme before first paint to avoid a light/dark flash. Mirrors ThemeProvider.
      try {
        var pref = localStorage.getItem('workbench.theme')
        var dark = pref === 'dark' || (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
